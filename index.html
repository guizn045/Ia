<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE IA - HUB</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080312;
            color: #f1e9ff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 🎬 TELA DE CARREGAMENTO ANIMADA */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #080312;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .splash-logo {
            color: #d8b4fe;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
            animation: pulsar 1.5s infinite ease-in-out;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .splash-insta {
            color: #a78bfa;
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            animation: pulsar 1.5s infinite ease-in-out;
            animation-delay: 0.3s;
        }
        @keyframes pulsar {
            0% { transform: scale(0.98); opacity: 0.6; }
            50% { transform: scale(1.03); opacity: 1; text-shadow: 0 0 30px rgba(168, 85, 247, 0.9); }
            100% { transform: scale(0.98); opacity: 0.6; }
        }

        /* Layout Principal do Site - Ocupa a tela toda */
        .site-wrapper {
            width: 100%;
            height: 100vh;
            max-width: 600px;
            background: #110724;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        body.loaded .site-wrapper {
            opacity: 1;
        }

        /* Topo do Site */
        .site-header {
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.2), rgba(124, 58, 237, 0.2));
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
            flex-shrink: 0;
        }
        .site-header h1 {
            color: #e9d5ff;
            font-size: 22px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .site-header span {
            font-size: 12px;
            color: #c084fc;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Abas de Configuração (Modos de Resposta) */
        .preset-bar {
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            flex-shrink: 0;
        }
        .tag-btn {
            flex: 1;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
            font-size: 11px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            text-align: center;
        }
        .tag-btn:hover, .tag-active {
            background: rgba(168, 85, 247, 0.4);
            border-color: #f3e8ff;
            color: #fff;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        /* 💬 ÁREA DE MENSAGENS (CHAT) */
        .chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(5, 2, 12, 0.4);
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        /* Mensagem do Usuário */
        .message.user {
            background: #6d28d9;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.3);
        }
        /* Mensagem da IA */
        .message.ai {
            background: rgba(30, 18, 54, 0.95);
            color: #f3e8ff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(168, 85, 247, 0.25);
        }
        .message.system {
            background: transparent;
            color: #a78bfa;
            align-self: center;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }
        .guiwz-highlight {
            color: #f3e8ff;
            font-weight: bold;
            background: rgba(168, 85, 247, 0.3);
            padding: 2px 4px;
            border-radius: 4px;
        }

        /* Preview de Imagem Anexada */
        .lens-preview {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 8px 16px;
            font-size: 12px;
            color: #e9d5ff;
            flex-shrink: 0;
        }
        .lens-remove {
            cursor: pointer;
            color: #ef4444;
            font-weight: bold;
            margin-left: 10px;
        }

        /* ⌨️ BARRA DE ENTRADA INFERIOR */
        .input-area {
            padding: 12px 16px;
            background: #0d061c;
            border-top: 1px solid rgba(168, 85, 247, 0.25);
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .textarea-input {
            flex: 1;
            height: 45px;
            padding: 12px;
            background: rgba(5, 2, 10, 0.6);
            color: #f3e8ff;
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 24px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
        }
        .textarea-input:focus {
            border-color: #d8b4fe;
        }
        .btn-action {
            background: linear-gradient(90deg, #a855f7, #6d28d9);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
            flex-shrink: 0;
        }
        .btn-action:hover {
            transform: scale(1.05);
        }
        .btn-secondary-row {
            display: flex;
            gap: 8px;
        }
        .btn-small {
            flex: 1;
            background: rgba(168, 85, 247, 0.12);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 6px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 🎬 Tela de Carregamento Roxo Neon -->
    <div id="splash-screen">
        <!-- COLOQUE O SEU NOVO NOME AQUI ABAIXO -->
        <div class="splash-logo">DIGITE O SEU NOVO NOME AQUI</div>
        <div class="splash-insta">BY @GUIWZ.045</div>
    </div>

    <!-- Estrutura Principal de Chat Fixo -->
    <div class="site-wrapper">
        <header class="site-header">
            <!-- COLOQUE O SEU NOVO NOME AQUI ABAIXO -->
            <h1>DIGITE O SEU NOVO NOME AQUI</h1>
            <span>@GUIWZ.045</span>
        </header>

        <div class="preset-bar">
            <button class="tag-btn tag-active" data-mode="padrao">✨ Padrão</button>
            <button class="tag-btn" data-mode="direta">🎯 Direta</button>
            <button class="tag-btn" data-mode="detalhada">📝 Passo a Passo</button>
        </div>
        <!-- Painel Central Onde as Mensagens Aparecem -->
        <main id="chat-container" class="chat-container">
            <div class="message system">[SISTEMA ONLINE - ENVIE UMA MENSAGEM OU PRINT]</div>
        </main>

        <!-- Preview de Anexo de Foto -->
        <div id="lens-preview" class="lens-preview">
            <span>📁 <strong id="lens-filename">Imagem carregada</strong></span>
            <span id="lens-remove" class="lens-remove">✖</span>
        </div>

        <!-- Barra Inferior de Digitação -->
        <footer class="input-area">
            <div class="input-row">
                <textarea id="input-search" class="textarea-input" placeholder="Pergunte qualquer coisa..."></textarea>
                <button id="btn-search" class="btn-action" title="Enviar">⚡</button>
            </div
            <div class="btn-secondary-row">
                <button id="btn-upload" class="btn-small">📁 ANEXAR PRINT</button>
                <button id="btn-clear" class="btn-small" style="color: #f87171; border-color: rgba(239,68,68,0.3);">🗑️ RESETAR CHAT</button>
            </div>
</section>
</footer>
</div>

<script>
  // Faz a tela de carregamento sumir
  window.addEventListener('load', function() {
    const splash = document.getElementById('splash-screen');
    if (splash) {
      splash.style.opacity = '0';
      setTimeout(() => {
        splash.style.display = 'none';
      }, 500);
    }
  });
</script>
</body>
</html>
