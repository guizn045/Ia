<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI</title>
    <style>
        body { background: #0b0614; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #221535; }
        .logo { font-weight: bold; font-size: 1.2rem; }
        .sub { font-size: 0.8rem; color: #a78bfa; }
        .modes { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; background: #130a24; }
        .mode-btn { background: #1a102f; border: 1px solid #3b2361; color: #fff; padding: 6px 14px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
        .mode-btn.active { background: #7c3aed; border-color: #8b5cf6; }
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .message.user { background: #7c3aed; align-self: flex-end; }
        .message.ai { background: #1a102f; border: 1px solid #2d1b4e; align-self: flex-start; }
        .input-area { display: flex; padding: 10px 15px; background: #0b0614; border-top: 1px solid #221535; gap: 8px; }
        .input-area input { flex: 1; background: #140b24; border: 1px solid #2d1b4e; color: #fff; padding: 10px 15px; border-radius: 20px; outline: none; }
        .input-area button { background: #7c3aed; border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        
        /* Modal de Configuração da Chave */
        .key-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; z-index: 10; }
        .key-box { background: #1a102f; border: 1px solid #7c3aed; padding: 20px; border-radius: 15px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
        .key-box input { background: #0b0614; border: 1px solid #3b2361; color: #fff; padding: 10px; border-radius: 8px; text-align: center; }
        .key-box button { background: #7c3aed; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .get-key-link { color: #a78bfa; font-size: 0.85rem; text-decoration: underline; margin-top: 5px; display: inline-block; }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="logo">NexusAI</div>
            <div class="sub">@GUIWY_045</div>
        </div>
        <button class="mode-btn" style="border-color:#7c3aed;" onclick="toggleKeyModal()">🔑 Chave API</button>
    </header>

    <div class="modes">
        <button class="mode-btn active" onclick="setMode('Padrão', this)">✨ Padrão</button>
        <button class="mode-btn" onclick="setMode('Direto', this)">🎯 Direto</button>
        <button class="mode-btn" onclick="setMode('Passo a Passo', this)">📚 Passo a Passo</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">✨ NEXUSAI<br>Olá! Clique em <b>🔑 Chave API</b> no topo para salvar sua chave da Groq localmente se ainda não configurou.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Pergunte qualquer coisa..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">➔</button>
    </div>

    <!-- Modal da Chave -->
    <div class="key-modal" id="keyModal">
        <div class="key-box">
            <h3>Configurar Chave Groq</h3>
            <p style="font-size:0.8rem; color:#ccc;">Sua chave será salva criptografada apenas no seu celular.</p>
            <input type="password" id="keyInput" placeholder="Cole sua chave (gsk_...) aqui">
            <button onclick="saveKey()">Salvar Chave</button>
            <a href="https://console.groq.com/keys" target="_blank" class="get-key-link">👉 Clique aqui para pegar sua chave na Groq</a>
            <button onclick="toggleKeyModal()" style="background:#333; margin-top:5px;">Fechar</button>
        </div>
    </div>

    <script>
        let currentMode = 'Padrão';

        // Criptografia simples (Base64) para ocultar no localStorage do navegador
        function encrypt(text) { return btoa(text); }
        function decrypt(stat) { try { return atob(stat); } catch(e) { return ""; } }

        function toggleKeyModal() {
            const modal = document.getElementById('keyModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
            const savedKey = localStorage.getItem('nexus_groq_key');
            if(savedKey) document.getElementById('keyInput').value = decrypt(savedKey);
        }

        function saveKey() {
            const val = document.getElementById('keyInput').value.trim();
            if(val) {
                localStorage.setItem('nexus_groq_key', encrypt(val));
                alert('Chave salva com sucesso no seu aparelho!');
                toggleKeyModal();
            }
        }

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.modes .mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            const text = input.value.trim();
            if (!text) return;

            const savedKeyEnc = localStorage.getItem('nexus_groq_key');
            const userApiKey = savedKeyEnc ? decrypt(savedKeyEnc) : "";

            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div class="message ai" id="${loadingId}">Pensando...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, mode: currentMode, userApiKey: userApiKey })
                });
                const data = await res.json();
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message ai">${data.response || data.error || 'Erro desconhecido'}</div>`;
            } catch (err) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message ai">Falha na conexão.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
