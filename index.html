    <script>
    let mensagensHistorico = [];

    async function enviarMensagem() {
        alert("Botão clicado com sucesso!"); // Teste rápido para ver se o telemóvel dispara o clique

        const input = document.getElementById('user-input');
        const textoUsuario = input.value.trim();
        if (!textoUsuario) {
            alert("A caixa de texto está vazia!");
            return;
        }

        input.value = "";
        adicionarMensagemNaTela("user", textoUsuario);
        mensagensHistorico.push({ role: "user", content: textoUsuario });

        const idEspera = adicionarMensagemNaTela("assistant", "A pensar...");

        try {
            const resposta = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: mensagensHistorico })
            });

            const dados = await resposta.json();
            const respostaIA = dados.reply || "Sem resposta do servidor.";
            
            removerMensagem(idEspera);
            adicionarMensagemNaTela("assistant", respostaIA);
            mensagensHistorico.push({ role: "assistant", content: respostaIA });
        } catch (erro) {
            alert("Erro no fetch: " + erro.message);
            removerMensagem(idEspera);
            adicionarMensagemNaTela("assistant", "Erro de ligação com o servidor: " + erro.message);
        }
    }

    function adicionarMensagemNaTela(role, texto) {
        const container = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = texto;
        div.id = 'msg-' + Math.random().toString(36).substring(2);
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div.id;
    }

    function removerMensagem(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }
    </script>
