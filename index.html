<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua IA - Chatbot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d11;
            color: #f4f4fc;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* TELA DE CARREGAMENTO ROXA NEON */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d11;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-logo {
            color: #d8b4fe;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .splash-insta {
            color: #a78bfa;
            font-size: 14px;
            font-weight: 500;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* Estrutura Principal do Chat */
        .site-wrapper {
            width: 100%;
            height: 100vh;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            background-color: #0d0d11;
            position: relative;
        }

        /* Topo do Site */
        .site-header {
            background: linear-gradient(180deg, rgba(168, 85, 247, 0.1), transparent);
            padding: 16px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            text-align: center;
        }

        .site-header h1 {
            font-size: 18px;
            color: #d8b4fe;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .site-header span {
            color: #a78bfa;
            font-size: 12px;
            font-weight: 600;
        }

        /* Abas de Configuração */
        .preset-bar {
            display: flex;
            padding: 12px;
            gap: 8px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.1);
        }

        .tag-btn {
            flex: 1;
            background: rgba(168, 85, 247, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.2);
            color: #a78bfa;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .tag-btn.tag-active {
            background: rgba(168, 85, 247, 0.2);
            color: #fff;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        /* Área de Mensagens */
        #chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-system {
            max-width: 90%;
            margin: 0 auto;
            padding: 8px 16px;
            background: rgba(168, 85, 247, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 20px;
            font-size: 11px;
            color: #a78bfa;
            text-align: center;
            font-weight: bold;
        }

        /* Preview de Anexo de Foto */
        .lens-preview {
            display: none;
            padding: 12px;
            background: rgba(168, 85, 247, 0.05);
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            align-items: center;
            justify-content: space-between;
        }

        .lens-preview span {
            font-size: 12px;
            color: #f4f4fc;
        }

        .lens-remove {
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            margin-left: 8px;
        }

        /* Barra Inferior de Digitação */
        .input-area {
            padding: 12px;
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            background-color: #0d0d11;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .textarea-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 12px;
            padding: 10px;
            color: #f4f4fc;
            font-size: 14px;
            resize: none;
            height: 42px;
            outline: none;
        }

        .btn-action {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
            flex-shrink: 0;
        }

        .btn-action:hover {
            transform: scale(1.05);
        }

        .btn-secondary-row {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            flex: 1;
            background: rgba(168, 85, 247, 0.12);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Tela de Carregamento Roxo Neon -->
    <div id="splash-screen">
        <div class="splash-logo">DIGITE O SEU NOVO NOME AQUI</div>
        <div class="splash-insta">BY @GUIWZ.045</div>
    </div>

    <!-- Estrutura Principal do Chat Fixo -->
    <div class="site-wrapper">
        <header class="site-header">
            <h1>DIGITE O SEU NOVO NOME AQUI</h1>
            <span>@GUIWZ.045</span>
        </header>

        <div class="preset-bar">
            <button class="tag-btn tag-active" data-mode="padrao">✨ Padrão</button>
            <button class="tag-btn" data-mode="direta">🎯 Direta</button>
            <button class="tag-btn" data-mode="detalhada">📚 Passo a Passo</button>
        </div>

        <!-- Painel Central Onde as Mensagens Aparecem -->
        <main id="chat-container">
            <div class="message-system">[SISTEMA ONLINE - ENVIE UMA MENSAGEM OU PRINT]</div>
        </main>

        <!-- Preview de Anexo de Foto -->
        <div id="lens-preview" class="lens-preview">
            <span><strong id="lens-filename">Imagem carregada</strong></span>
            <span id="lens-remove" class="lens-remove">✕</span>
        </div>

        <!-- Barra Inferior de Digitação -->
        <footer class="input-area">
            <div class="input-row">
                <textarea id="input-search" class="textarea-input" placeholder="Pergunte qualquer coisa..."></textarea>
                <button id="btn-search" class="btn-action" title="Enviar">⚡</button>
            </div>
            <div class="btn-secondary-row">
                <button id="btn-upload" class="btn-small">📸 ANEXAR PRINT</button>
                <button id="btn-clear" class="btn-small" style="color: #f87171; border-color: rgba(248, 113, 113, 0.2);">🗑️ LIMPAR CHAT</button>
            </div>
        </footer>
    </div>

    <!-- Script de Automação da Tela de Carregamento -->
    <script>
        window.addEventListener('load', function() {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);
            }
        });
    </script>
</body>
</html>
