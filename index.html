<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Meu Chat Privado</title>
    <!-- Os teus estilos CSS aqui -->
</head>
<body>

    <!-- O teu layout do chat aqui -->

    <!-- COLA O TEU JAVASCRIPT AQUI DENTRO -->
    <script>
    async function enviarMensagem(textoUsuario) {
        mensagensHistorico.push({ role: "user", content: textoUsuario });

        try {
            const resposta = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: mensagensHistorico })
            });

            const dados = await resposta.json();
            adicionarMensagemNaTela("assistant", dados.reply);
            mensagensHistorico.push({ role: "assistant", content: dados.reply });
        } catch (erro) {
            console.error("Erro:", erro);
            adicionarMensagemNaTela("assistant", "Erro de ligação com o servidor.");
        }
    }
    </script>
</body>
</html>
