<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Privado - Qwen</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #fff; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 12px; 
            max-width: 85%; 
            word-break: break-word; 
            line-height: 1.4;
            font-size: 15px;
        }
        .user { background: #007bff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .assistant { background: #2a2a2a; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-container { 
            display: flex; 
            padding: 12px; 
            background: #1e1e1e; 
            border-top: 1px solid #333; 
        }
        #user-input { 
            flex: 1; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 16px; 
            outline: none;
        }
        #user-input:focus { border-color: #007bff; }
        #send-btn { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 0 20px; 
            margin-left: 8px; 
            border-radius: 8px; 
            font-weight: bold;
            cursor: pointer; 
        }
        #send-btn:active { background: #0056b3; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message assistant">Olá! O teu chat privado na nuvem está pronto. Como te posso ajudar hoje?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escreve uma mensagem..." onkeydown="if(event.key==='Enter') enviarMensagem()">
        <button id="send-btn" onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
    let mensagensHistorico = [];

    async function enviarMensagem() {
        const input = document.getElementById('user-input');
        const textoUsuario = input.value.trim();
        if (!textoUsuario) return;

        // Limpa o campo e adiciona a mensagem do utilizador ao ecrã
        input.value = "";
        adicionarMensagemNaTela("user", textoUsuario);
        mensagensHistorico.push({ role: "user", content: textoUsuario });

        // Indicador temporário de carregamento
        const idEspera = adicionarMensagemNaTela("assistant", "A pensar...");

        try {
            const resposta = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: mensagensHistorico })
            });

            const dados = await resposta.json();
            const respostaIA = dados.reply || "Sem resposta do servidor.";
            
            // Remove a mensagem de espera e coloca a resposta real
            removerMensagem(idEspera);
            adicionarMensagemNaTela("assistant", respostaIA);
            mensagensHistorico.push({ role: "assistant", content: respostaIA });
        } catch (erro) {
            console.error("Erro:", erro);
            removerMensagem(idEspera);
            adicionarMensagemNaTela("assistant", "Erro de ligação com o servidor.");
        }
    }

    function adicionarMensagemNaTela(role, texto) {
        const container = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = texto;
        div.id = 'msg-' + Math.random().toString(36.substring(2));
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div.id;
    }

    function removerMensagem(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }
    </script>
</body>
</html>
