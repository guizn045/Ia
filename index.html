<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI</title>
    <style>
        body { background: #0b0614; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #221535; }
        .logo { font-weight: bold; font-size: 1.2rem; }
        .sub { font-size: 0.8rem; color: #a78bfa; }
        .insta-btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; padding: 6px 12px; border-radius: 20px; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
        .modes { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; }
        .mode-btn { background: #1a102f; border: 1px solid #3b2361; color: #fff; padding: 6px 14px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; }
        .mode-btn.active { background: #7c3aed; border-color: #8b5cf6; }
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .message.user { background: #7c3aed; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.ai { background: #1a102f; border: 1px solid #2d1b4e; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 10px 15px; background: #0b0614; border-top: 1px solid #221535; gap: 8px; }
        .input-area input { flex: 1; background: #140b24; border: 1px solid #2d1b4e; color: #fff; padding: 10px 15px; border-radius: 20px; outline: none; font-size: 0.95rem; }
        .input-area button { background: #7c3aed; border: none; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }
        .dev-warning { background: #2e1a0b; color: #fbbf24; text-align: center; font-size: 0.75rem; padding: 5px; border-bottom: 1px solid #452a0d; }
    </style>
</head>
<body>
    <div class="dev-warning">⚠️ Essa IA está em desenvolvimento</div>
    <header>
        <div>
            <div class="logo">NexusAI</div>
            <div class="sub">@GUIWY_045</div>
        </div>
        <a href="https://instagram.com" class="insta-btn" target="_blank">Instagram</a>
    </header>

    <div class="modes">
        <button class="mode-btn active" onclick="setMode('Padrão', this)">✨ Padrão</button>
        <button class="mode-btn" onclick="setMode('Direto', this)">🎯 Direto</button>
        <button class="mode-btn" onclick="setMode('Passo a Passo', this)">📚 Passo a Passo</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">✨ NEXUSAI<br>Olá! Como posso ajudar você hoje?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Pergunte qualquer coisa..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">➔</button>
    </div>

    <script>
        let currentMode = 'Padrão';
        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            const text = input.value.trim();
            if (!text) return;

            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div class="message ai" id="${loadingId}">Pensando...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, mode: currentMode })
                });
                const data = await res.json();
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message ai">${data.response || data.error || 'Erro desconhecido'}</div>`;
            } catch (err) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message ai">Falha na conexão.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
