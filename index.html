<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Advanced</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body { 
            background: #05020a; 
            color: #f3f4f6; 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            height: 100dvh; 
            overflow: hidden; 
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }

        .app-wrapper {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: rgba(11, 6, 20, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(45, 27, 78, 0.5);
        }

        @media (min-width: 768px) {
            .app-wrapper {
                width: 950px;
                height: 92vh;
                border-radius: 24px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(124, 58, 237, 0.15);
            }
        }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #221535; background: rgba(11, 6, 20, 0.8); z-index: 5; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .menu-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: color 0.2s; }
        .menu-btn:hover { color: #a78bfa; }
        .logo-area { display: flex; flex-direction: column; }
        .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: 0.5px; background: linear-gradient(45deg, #fff, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub { font-size: 0.75rem; color: #a78bfa; }

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; backdrop-filter: blur(4px); }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #130a24; border-right: 1px solid #2d1b4e; transition: left 0.3s ease; z-index: 101; display: flex; flex-direction: column; padding: 20px; gap: 15px; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d1b4e; padding-bottom: 15px; }
        .sidebar-title { font-weight: bold; font-size: 1.1rem; color: #a78bfa; }
        .close-sidebar { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }
        .sidebar-menu-item { display: flex; align-items: center; gap: 12px; background: #1a102f; border: 1px solid #3b2361; color: #fff; padding: 12px 15px; border-radius: 12px; text-decoration: none; font-size: 0.95rem; cursor: pointer; transition: background 0.2s, transform 0.1s; }
        .sidebar-menu-item:hover { background: #251642; transform: translateX(4px); }
        .insta-icon-badge { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: #fff; }

        .modes { display: flex; gap: 10px; padding: 12px 20px; overflow-x: auto; background: rgba(15, 8, 28, 0.6); border-bottom: 1px solid #1a102f; flex-shrink: 0; }
        .modes::-webkit-scrollbar { display: none; }
        .mode-btn { background: #160d26; border: 1px solid #2d1b4e; color: #cbd5e1; padding: 7px 16px; border-radius: 16px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; transition: all 0.2s; flex-shrink: 0; font-family: 'Outfit', sans-serif; }
        .mode-btn:hover { background: #221535; border-color: #7c3aed; }
        .mode-btn.active { background: #7c3aed; border-color: #8b5cf6; color: #fff; font-weight: 600; box-shadow: 0 0 15px rgba(124, 58, 237, 0.4); }

        .chat-container { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #2d1b4e; border-radius: 10px; }
        
        .message { max-width: 85%; padding: 16px 20px; border-radius: 18px; font-size: 0.97rem; line-height: 1.6; word-break: break-word; white-space: pre-wrap; position: relative; }
        
        .message.user { 
            background: #7c3aed; 
            color: #ffffff; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px; 
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
            font-weight: 500;
        }
        
        .message.ai { 
            background: #160d26; 
            border: 1px solid #2d1b4e; 
            color: #f3f4f6; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-weight: 400;
        }
        
        .message img { max-width: 100%; border-radius: 12px; margin-top: 12px; border: 1px solid #3b2361; display: block; }

        .ai-message-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 8px; border-top: 1px solid rgba(45, 27, 78, 0.5); font-size: 0.75rem; color: #9ca3af; }
        .ai-speed-badge { background: rgba(124, 58, 237, 0.15); color: #c4b5fd; padding: 2px 8px; border-radius: 6px; font-weight: 500; border: 1px solid rgba(124, 58, 237, 0.3); }
        .voice-btn { background: none; border: none; color: #a78bfa; cursor: pointer; font-size: 1rem; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px; transition: background 0.2s; }
        .voice-btn:hover { background: rgba(167, 139, 250, 0.1); color: #fff; }

        .suggestion-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .chip { background: #1f1235; border: 1px solid #3b2361; color: #d8b4fe; padding: 6px 12px; border-radius: 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
        .chip:hover { background: #7c3aed; color: #fff; border-color: #8b5cf6; }

        .code-box-wrapper { background: #0a0512; border: 1px solid #2d1b4e; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .code-header { background: #130a24; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #a78bfa; border-bottom: 1px solid #2d1b4e; }
        .copy-code-btn { background: #221535; border: 1px solid #3b2361; color: #d8b4fe; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: background 0.2s; }
        .copy-code-btn:hover { background: #7c3aed; color: #fff; }
        .code-content { padding: 12px; font-family: monospace; font-size: 0.85rem; color: #e2e8f0; overflow-x: auto; margin: 0; }

        .image-preview-bar { display: none; padding: 10px 20px; background: #130a24; border-top: 1px solid #221535; align-items: center; gap: 12px; flex-shrink: 0; }
        .image-preview-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; border: 1px solid #7c3aed; }
        .remove-image-btn { background: #ef4444; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .input-area { display: flex; padding: 14px 20px; background: rgba(11, 6, 20, 0.9); border-top: 1px solid #221535; gap: 12px; align-items: center; flex-shrink: 0; }
        .input-actions { display: flex; gap: 6px; }
        .action-icon-btn { background: #160d26; border: 1px solid #2d1b4e; color: #a78bfa; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; transition: background 0.2s, transform 0.1s; flex-shrink: 0; }
        .action-icon-btn:hover { background: #221535; transform: scale(1.05); }
        .input-area input[type="text"] { flex: 1; background: #140b24; border: 1px solid #2d1b4e; color: #fff; padding: 12px 18px; border-radius: 24px; outline: none; font-size: 0.95rem; font-family: 'Outfit', sans-serif; transition: border-color 0.2s; }
        .input-area input[type="text"]:focus { border-color: #7c3aed; box-shadow: 0 0 10px rgba(124, 58, 237, 0.2); }
        .send-btn { background: #7c3aed; border: none; color: white; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); transition: transform 0.1s, background 0.2s; flex-shrink: 0; }
        .send-btn:hover { background: #6d28d9; }
        .send-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">NexusAI Menu</span>
                <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
            </div>
            <a href="#" class="sidebar-menu-item" onclick="toggleSidebar(); clearChat();">
                <span>💬 Nova Conversa</span>
            </a>
            <a href="#" class="sidebar-menu-item" onclick="configureApiKey()">
                <span>🔑 Configurar Chave API</span>
            </a>
            <a href="https://instagram.com" target="_blank" class="sidebar-menu-item">
                <div class="insta-icon-badge">📷</div>
                <span>Instagram @GUIWY_045</span>
            </a>
        </div>

        <header>
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <div class="logo-area">
                    <div class="logo">NexusAI</div>
                    <div class="sub">@GUIWY_045</div>
                </div>
            </div>
        </header>

        <div class="modes">
            <button class="mode-btn active" onclick="setMode('Padrão', this)">✨ Padrão</button>
            <button class="mode-btn" onclick="setMode('Direto', this)">🎯 Direto</button>
            <button class="mode-btn" onclick="setMode('Passo a Passo', this)">📚 Passo a Passo</button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message ai">✨ <b>NEXUSAI v2.0</b><br><br>Olá! Clique em <b>☰</b> no canto superior esquerdo para configurar sua Chave API do Groq, escolha um modo acima ou comece a conversar!</div>
        </div>

        <div class="image-preview-bar" id="imagePreviewBar">
            <img id="imagePreviewThumb" class="image-preview-thumb" src="" alt="Preview">
            <span style="font-size: 0.85rem; color: #a78bfa; flex: 1;">Imagem anexada</span>
            <button class="remove-image-btn" onclick="removeAttachedImage()">✕</button>
        </div>

        <div class="input-area">
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
            <div class="input-actions">
                <button class="action-icon-btn" onclick="document.getElementById('imageInput').click()" title="Anexar Imagem">📎</button>
            </div>
            <input type="text" id="userInput" placeholder="Digite sua mensagem para a NexusAI..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➔</button>
        </div>
    </div>

    <script>
        let currentMode = 'Padrão';
        let currentImageBase64 = null;
        let aiResponsesStorage = [];

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isOpen = sidebar.classList.toggle('open');
            overlay.style.display = isOpen ? 'block' : 'none';
        }

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.modes .mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            aiResponsesStorage = [];
            document.getElementById('chatContainer').innerHTML = `<div class="message ai">✨ <b>NEXUSAI [Modo: ${mode}]</b><br><br>Nova sessão iniciada no modo <b>${mode}</b>. Como posso ajudar?</div>`;
        }

        function clearChat() {
            aiResponsesStorage = [];
            document.getElementById('chatContainer').innerHTML = `<div class="message ai">✨ <b>NEXUSAI</b><br><br>Nova conversa iniciada. Como posso ajudar?</div>`;
        }

        function configureApiKey() {
            let currentKey = "";
            try {
                const saved = localStorage.getItem('nexus_groq_key');
                if (saved) currentKey = atob(saved);
            } catch(e){}
            const newKey = prompt("Insira sua Chave API do Groq (console.groq.com):", currentKey);
            if (newKey !== null) {
                if (newKey.trim() === "") {
                    localStorage.removeItem('nexus_groq_key');
                    alert("Chave API removida.");
                } else {
                    localStorage.setItem('nexus_groq_key', btoa(newKey.trim()));
                    alert("Chave API salva com sucesso!");
                }
            }
            toggleSidebar();
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageBase64 = e.target.result;
                document.getElementById('imagePreviewThumb').src = currentImageBase64;
                document.getElementById('imagePreviewBar').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function removeAttachedImage() {
            currentImageBase64 = null;
            document.getElementById('imagePreviewBar').style.display = 'none';
            document.getElementById('imageInput').value = '';
        }

        function speakStoredText(index) {
            const textToSpeak = aiResponsesStorage[index];
            if (textToSpeak && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'pt-BR';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Leitura de voz indisponível.');
            }
        }

        function copyCode(btn) {
            const codeEl = btn.parentElement.nextElementSibling;
            const textToCopy = codeEl.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                btn.innerText = 'Copiado! ✓';
                setTimeout(() => { btn.innerText = 'Copiar'; }, 2000);
            });
        }

        function sendQuickPrompt(promptText) {
            document.getElementById('userInput').value = promptText;
            sendMessage();
        }

        function formatAIResponse(text) {
            let safeText = escapeHtml(text);
            safeText = safeText.replace(/```([a-z]*)\n([\s\S]*?)```/g, function(match, lang, code) {
                return `<div class="code-box-wrapper">
                    <div class="code-header">
                        <span>${lang || 'código'}</span>
                        <button class="copy-code-btn" onclick="copyCode(this)">Copiar</button>
                    </div>
                    <pre class="code-content"><code>${code.trim()}</code></pre>
                </div>`;
            });
            return safeText;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            const text = input.value.trim();
            if (!text && !currentImageBase64) return;

            let userApiKey = "";
            try {
                const savedKeyEnc = localStorage.getItem('nexus_groq_key');
                if (savedKeyEnc) userApiKey = atob(savedKeyEnc);
            } catch(e) {}

            if (!userApiKey) {
                alert("⚠️ Por favor, abra o menu (☰) no canto superior esquerdo e clique em 'Configurar Chave API' para inserir sua chave do Groq.");
                toggleSidebar();
                return;
            }

            let userHtml = `<div class="message user">`;
            if (currentImageBase64) {
                userHtml += `<img src="${currentImageBase64}" alt="Uploaded image"><br>`;
            }
            userHtml += `${escapeHtml(text || "Analise esta imagem.")}</div>`;
            container.innerHTML += userHtml;

            const imgToSend = currentImageBase64;
            input.value = '';
            removeAttachedImage();
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div class="message ai" id="${loadingId}">Pensando...</div>`;
            container.scrollTop = container.scrollHeight;

            const startTime = performance.now();

            try {
                let systemInstruction = "Você é a NexusAI (@GUIWY_045), uma inteligência artificial avançada, prestativa e inteligente.";
                if (currentMode === 'Direto') systemInstruction += " Seja extremamente direto, conciso e objetivo.";
                if (currentMode === 'Passo a Passo') systemInstruction += " Responda detalhadamente dividindo a resposta em passos organizados.";

                const apiUrl = 'https://api.groq.com/openai/v1/chat/completions';
                const proxyUrl = 'https://corsproxy.io/?url=' + encodeURIComponent(apiUrl);

                const res = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userApiKey}`
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            { role: 'system', content: systemInstruction },
                            { role: 'user', content: text || "Analise esta imagem." }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await res.json();
                document.getElementById(loadingId).remove
