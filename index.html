<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: #050507; color: #f4f4fc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d0d11; z-index: 99; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.4s; }
        .logo { color: #d8b4fe; font-size: 26px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(168,85,247,0.5); }
        
        .wrapper { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #0d0d11; position: relative; }
        @media (min-width: 768px) { .wrapper { width: 100%; max-width: 650px; height: 85vh; border-radius: 12px; border: 1px solid rgba(168, 85, 247, 0.2); } }
        
        header { padding: 12px; border-bottom: 1px solid rgba(168, 85, 247, 0.15); display: flex; justify-content: space-between; align-items: center; }
        .header-title h2 { color: #d8b4fe; letter-spacing: 1px; font-size: 18px; }
        .header-title span { color: #a78bfa; font-size: 11px; }
        .settings-btn { background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); color: #d8b4fe; padding: 6px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        
        .bar { display: flex; padding: 8px; gap: 6px; border-bottom: 1px solid rgba(168, 85, 247, 0.1); }
        .btn { flex: 1; background: rgba(168, 85, 247, 0.05); border: 1px solid rgba(168, 85, 247, 0.2); color: #a78bfa; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn.active { background: rgba(168, 85, 247, 0.25); color: #fff; border-color: #a855f7; }
        
        #chat { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .sys { font-size: 11px; color: #a78bfa; text-align: center; margin: 4px; font-weight: bold; }
        
        footer { padding: 12px; border-top: 1px solid rgba(168, 85, 247, 0.15); display: flex; flex-direction: column; gap: 8px; }
        
        #img-preview-container { display: none; align-items: center; gap: 8px; background: rgba(168, 85, 247, 0.1); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(168, 85, 247, 0.2); }
        #img-preview { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
        #remove-img { background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; font-size: 16px; margin-left: auto; }

        .row { display: flex; gap: 6px; align-items: center; }
        textarea { flex: 1; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(168, 85, 247, 0.25); border-radius: 10px; padding: 10px; color: #fff; resize: none; height: 44px; outline: none; }
        .icon-btn { background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); width: 44px; height: 44px; border-radius: 10px; color: #d8b4fe; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        #send { background: linear-gradient(135deg, #a855f7, #6366f1); border: none; width: 44px; height: 44px; border-radius: 10px; color: #fff; cursor: pointer; font-size: 16px; }
        .sub-btn { flex: 1; background: rgba(168, 85, 247, 0.1); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.2); padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        
        #modal-api { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 7, 0.9); z-index: 50; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #0d0d11; border: 1px solid rgba(168, 85, 247, 0.4); padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .modal-content h3 { color: #d8b4fe; font-size: 16px; text-align: center; }
        .modal-content input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 8px; padding: 10px; color: #fff; outline: none; }
        .modal-actions { display: flex; gap: 8px; }
    </style>
</head>
<body>
    <div id="splash"><div class="logo">NexusAI</div><div style="color: #a78bfa; font-size: 13px; margin-top: 4px;">BY @GUIWZ.045</div></div>
    
    <div class="wrapper">
        <header>
            <div class="header-title">
                <h2>NexusAI</h2>
                <span>@GUIWZ.045</span>
            </div>
            <button id="open-api-modal" class="settings-btn">⚙️ API Key</button>
        </header>

        <div class="bar">
            <button class="btn active" data-m="Padrão">✨ Padrão</button>
            <button class="btn" data-m="Direto">🎯 Direto</button>
            <button class="btn" data-m="Passo a Passo">📚 Passo a Passo</button>
        </div>

        <main id="chat"><div class="sys">[SISTEMA ONLINE - API PRONTA]</div></main>

        <footer>
            <div id="img-preview-container">
                <img id="img-preview" src="" alt="Print anexado">
                <span style="font-size: 12px; color: #d8b4fe;">Imagem anexada</span>
                <button id="remove-img">✕</button>
            </div>

            <div class="row">
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <button id="attach-btn" class="icon-btn" title="Anexar Imagem ou Print">📎</button>
                <textarea id="txt" placeholder="Pergunte qualquer coisa..."></textarea>
                <button id="send">⚡</button>
            </div>

            <div class="row">
                <button id="clear" class="sub-btn">🗑️ LIMPAR CHAT</button>
            </div>
        </footer>

        <div id="modal-api">
            <div class="modal-content">
                <h3>Configuração da Groq API</h3>
                <p style="font-size: 12px; color: #a78bfa;">Insira sua chave da Groq. Ela fica salva apenas no seu navegador (localStorage) com segurança.</p>
                <input type="password" id="api-key-input" placeholder="gsk_...">
                <div class="modal-actions">
                    <button id="save-api-key" class="sub-btn" style="background: rgba(168, 85, 247, 0.3);">Salvar</button>
                    <button id="close-api-modal" class="sub-btn">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const sp = document.getElementById('splash');
                if (sp) { sp.style.opacity = '0'; setTimeout(() => sp.style.display = 'none', 400); }
            }, 400);
        });
        
        let modo = "Padrão";
        let base64Image = null;

        const btns = document.querySelectorAll('.btn');
        btns.forEach(b => b.addEventListener('click', () => {
            btns.forEach(x => x.classList.remove('active')); b.classList.add('active');
            modo = b.getAttribute('data-m');
        }));

        const txt = document.getElementById('txt'), send = document.getElementById('send'), chat = document.getElementById('chat');
        const fileInput = document.getElementById('file-input'), attachBtn = document.getElementById('attach-btn');
        const imgPreviewContainer = document.getElementById('img-preview-container'), imgPreview = document.getElementById('img-preview'), removeImgBtn = document.getElementById('remove-img');
        
        const modalApi = document.getElementById('modal-api'), openApiBtn = document.getElementById('open-api-modal'), closeApiBtn = document.getElementById('close-api-modal'), saveApiKeyBtn = document.getElementById('save-api-key'), apiKeyInput = document.getElementById('api-key-input');

        openApiBtn.addEventListener('click', () => {
            apiKeyInput.value = localStorage.getItem('nexus_groq_key') || '';
            modalApi.style.display = 'flex';
        });
        closeApiBtn.addEventListener('click', () => modalApi.style.display = 'none');
        saveApiKeyBtn.addEventListener('click', () => {
            localStorage.setItem('nexus_groq_key', apiKeyInput.value.trim());
            modalApi.style.display = 'none';
            alert('Chave da Groq salva com sucesso!');
        });

        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    base64Image = evt.target.result;
                    imgPreview.src = base64Image;
                    imgPreviewContainer.style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        });

        removeImgBtn.addEventListener('click', () => {
            base64Image = null;
            fileInput.value = '';
            imgPreviewContainer.style.display = 'none';
        });

        function balao(texto, usuario, imagemSrc = null) {
            const b = document.createElement('div');
            b.style.maxWidth = '80%'; b.style.padding = '10px 14px'; b.style.borderRadius = '12px'; b.style.fontSize = '14px'; b.style.marginBottom = '4px'; b.style.wordBreak = 'break-word';
            
            if (usuario) {
                b.style.alignSelf = 'flex-end'; b.style.background = 'linear-gradient(135deg, #a855f7, #6366f1)'; b.style.color = '#fff';
            } else {
                b.style.alignSelf = 'flex-start'; b.style.background = 'rgba(255,255,255,0.05)'; b.style.border = '1px solid rgba(168,85,247,0.2)'; b.style.color = '#f4f4fc';
            }

            if (imagemSrc) {
                const img = document.createElement('img');
                img.src = imagemSrc;
                img.style.maxWidth = '100%';
                img.style.borderRadius = '8px';
                img.style.marginBottom = '8px';
                img.style.display = 'block';
                b.appendChild(img);
            }

            if (texto) {
                const txtDiv = document.createElement('div');
                txtDiv.innerText = texto;
                b.appendChild(txtDiv);
            }

            chat.appendChild(b); chat.scrollTop = chat.scrollHeight; return b;
        }

        async function enviar() {
            const val = txt.value.trim(); 
            if (!val && !base64Image) return;

            const currentImg = base64Image;
            balao(val, true, currentImg); 

            txt.value = "";
            base64Image = null;
            fileInput.value = '';
            imgPreviewContainer.style.display = 'none';

            const apiKey = localStorage.getItem('nexus_groq_key');

            if (!apiKey) {
                const bIA = balao("NexusAI está digitando...", false);
                setTimeout(() => {
                    let r = "Dica: Clique no botão '⚙️ API Key' no topo para colocar sua chave da Groq e destravar a IA real! Enquanto isso, respondo localmente: " + val;
                    bIA.innerText = r;
                }, 500);
                return;
            }

            const bIA = balao("NexusAI está pensando...", false);

            try {
                let systemPrompt = "Você é o NexusAI, um assistente de tecnologia inteligente criado por @GUIWZ.045.";
                if (modo === "Direto") systemPrompt += " Seja extremamente direto, curto e sem enrolação nas respostas.";
                if (modo === "Passo a Passo") systemPrompt += " Estruture sempre suas respostas em tópicos e passos lógicos claros.";

                let messages = [
                    { role: "system", content: systemPrompt }
                ];

                // Atualizado para usar os modelos atuais recomendados da Groq
                let modelName = "llama-3.1-8b-instant";
                
                if (currentImg) {
                    modelName = "qwen/qwen3.6-27b"; // Modelo com suporte a visão na Groq
                    messages.push({
                        role: "user",
                        content: [
                            { type: "text", text: val || "Analise esta imagem:" },
                            { type: "image_url", image_url: { url: currentImg } }
                        ]
                    });
                } else {
                    messages.push({ role: "user", content: val });
                }

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: modelName,
                        messages: messages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();

                if (data.choices && data.choices.length > 0) {
                    bIA.innerText = data.choices[0].message.content;
                } else if (data.error) {
                    bIA.innerText = "Erro na API da Groq: " + (data.error.message || "Verifique sua chave.");
                } else {
                    bIA.innerText = "Erro desconhecido ao processar a resposta.";
                }

            } catch (error) {
                bIA.innerText = "Falha de conexão com a API. Verifique sua internet.";
                console.error(error);
            }

            chat.scrollTop = chat.scrollHeight;
        }

        send.addEventListener('click', enviar);
        txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });
        document.getElementById('clear').addEventListener('click', () => { chat.innerHTML = '<div class="sys">[CHAT LIMPO]</div>'; });
    </script>
</body>
</html>
