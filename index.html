<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - OpenRouter Edition</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #05020a; color: #f3f4f6; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; }
        .app-wrapper { width: 100%; height: 100vh; height: 100dvh; background: #0b0614; display: flex; flex-direction: column; border: 1px solid #2d1b4e; }
        header { padding: 14px 20px; border-bottom: 1px solid #221535; background: #0b0614; color: #fff; font-weight: bold; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 14px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
        .message.user { background: #7c3aed; color: #fff; align-self: flex-end; }
        .message.ai { background: #160d26; border: 1px solid #2d1b4e; color: #f3f4f6; align-self: flex-start; }
        .input-area { display: flex; padding: 14px 20px; background: #0b0614; border-top: 1px solid #221535; gap: 10px; }
        .input-area input { flex: 1; background: #140b24; border: 1px solid #2d1b4e; color: #fff; padding: 12px 18px; border-radius: 20px; outline: none; }
        .send-btn { background: #7c3aed; border: none; color: white; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header>NexusAI Pro (OpenRouter)</header>
        <div class="chat-container" id="chatContainer">
            <div class="message ai">Olá! Pronto para conversar sem censura.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➔</button>
        </div>
    </div>
    <script>
        let messageHistory = [];
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            appendMessage(text, 'user');
            messageHistory.push({ role: 'user', content: text });
            input.value = '';
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messageHistory })
                });
                const data = await response.json();
                const reply = data.reply || data.error || 'Sem resposta.';
                appendMessage(reply, 'ai');
                messageHistory.push({ role: 'assistant', content: reply });
            } catch (err) {
                appendMessage('⚠️ Erro de conexão.', 'ai');
            }
        }
        function appendMessage(text, sender) {
            const container = document.getElementById('chatContainer');
            const msg = document.createElement('div');
            msg.className = 'message ' + sender;
            msg.textContent = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
