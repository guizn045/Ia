<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA 6.0 TURBO - Hub Roxo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0c0518;
            color: #f1e9ff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        /* 🎬 TELA DE CARREGAMENTO ANIMADA */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0c0518;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .splash-logo {
            color: #d8b4fe;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
            animation: pulsar 1.5s infinite ease-in-out;
            margin-bottom: 15px;
        }
        .splash-insta {
            color: #a78bfa;
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            animation: pulsar 1.5s infinite ease-in-out;
            animation-delay: 0.3s;
        }
        @keyframes pulsar {
            0% { transform: scale(0.98); opacity: 0.6; }
            50% { transform: scale(1.03); opacity: 1; text-shadow: 0 0 30px rgba(168, 85, 247, 0.9); }
            100% { transform: scale(0.98); opacity: 0.6; }
        }

        /* Layout Principal do Site */
        .site-wrapper {
            width: 100%;
            max-width: 500px;
            background: rgba(18, 10, 36, 0.95);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 30px rgba(168, 85, 247, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
        }
        body.loaded .site-wrapper {
            opacity: 1;
            transform: scale(1);
        }

        .site-header {
            background: linear-gradient(90deg, rgba(168,85,247,0.2), rgba(124,58,237,0.2));
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
        }
        .site-header h1 {
            color: #e9d5ff;
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
            margin-bottom: 4px;
        }
        .site-header span {
            font-size: 11px;
            color: #c084fc;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .app-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .status-card {
            background: rgba(10, 5, 22, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .status-avatar {
            font-family: monospace;
            font-size: 24px;
            color: #d8b4fe;
            text-shadow: 0 0 10px #a855f7;
            font-weight: bold;
        }
        .status-info h2 {
            color: #c084fc;
            font-size: 12px;
            margin-bottom: 2px;
        }
        .status-info p {
            font-size: 11px;
            color: #e9d5ff;
            line-height: 1.3;
        }

        .preset-bar {
            display: flex;
            gap: 6px;
        }
        .tag-btn {
            flex: 1;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
            font-size: 11px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            text-align: center;
        }
        .tag-btn:hover, .tag-active {
            background: rgba(168, 85, 247, 0.35);
            border-color: #f3e8ff;
            color: #fff;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }
        .textarea-input {
            width: 100%;
            height: 90px;
            padding: 12px;
            padding-right: 45px;
            background: rgba(5, 2, 10, 0.5);
            color: #f3e8ff;
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 10px;
            font-size: 13px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }
        .textarea-input:focus {
            border-color: #d8b4fe;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }
        .btn-clear {
            position: absolute;
            right: 10px;
            top: 10px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .lens-preview {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #e9d5ff;
        }
        .lens-remove {
            cursor: pointer;
            color: #ef4444;
            font-weight: bold;
        }

        .action-row {
            display: flex;
            gap: 8px;
        }
        .btn-search {
            flex: 2;
            background: linear-gradient(90deg, #a855f7, #6d28d9);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }
        .btn-search:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
            transform: scale(1.02);
        }
        .btn-upload {
            flex: 1;
            background: rgba(168, 85, 247, 0.15);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-copy {
            background: rgba(124, 58, 237, 0.2);
            color: #e9d5ff;
            border: 1px solid rgba(168, 85, 247, 0.5);
            padding: 0 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: none;
        }

        .output-box {
            background: rgba(5, 2, 10, 0.6);
            color: #f3e8ff;
            padding: 14px;
            height: 200px;
            overflow-y: auto;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            border: 1px solid rgba(168, 85, 247, 0.25);
            user-select: text;
        }
        .guiwz-highlight {
            color: #e9d5ff;
            font-weight: bold;
            background: rgba(168, 85, 247, 0.25);
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Splash Screen Roxa -->

        <div class="splash-logo">⚡ AURA 6.0 TURBO</div>
        <div class="splash-insta">BY @GUIWZ.045</div>
    </div>

    <!-- Estrutura Principal -->
    <div class="site-wrapper">

            </div>

            <div class="action-row">
