    <script>
        // 1. Controle da Tela de Carregamento
        window.addEventListener('load', function() {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 500);
            }
        });

        // 2. Alternar entre as Abas (Padrão, Direta, Passo a Passo)
        let modoAtual = "padrao";
        const buttons = document.querySelectorAll('.tag-btn');
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                buttons.forEach(btn => btn.classList.remove('tag-active'));
                button.classList.add('tag-active');
                modoAtual = button.getAttribute('data-mode');
            });
        });

        // 3. Sistema de Envio de Texto e Conexão Real com a Groq
        const searchInput = document.getElementById('input-search');
        const sendBtn = document.getElementById('btn-search');
        const chatContainer = document.getElementById('chat-container');
        
        // ATENÇÃO: Substitua os asteriscos abaixo pela sua chave gsk_ APENAS se o seu repositório for PRIVADO. 
        // Se for público, use uma estrutura de servidor/proxy ou cole temporariamente para testar sabendo do risco.
        const GROQ_KEY = "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"; 

        function adicionarBalao(texto, tipo) {
            const balao = document.createElement('div');
            balao.style.maxWidth = '80%';
            balao.style.padding = '12px 16px';
            balao.style.borderRadius = '14px';
            balao.style.fontSize = '14px';
            balao.style.lineHeight = '1.4';
            balao.style.wordBreak = 'break-word';
            balao.style.marginBottom = '8px';
            
            if (tipo === 'usuario') {
                balao.style.alignSelf = 'flex-end';
                balao.style.background = 'linear-gradient(135deg, #a855f7, #6366f1)';
                balao.style.color = '#ffffff';
                balao.style.borderBottomRightRadius = '4px';
            } else if (tipo === 'ia') {
                balao.style.alignSelf = 'flex-start';
                balao.style.background = 'rgba(255, 255, 255, 0.05)';
                balao.style.border = '1px solid rgba(168, 85, 247, 0.2)';
                balao.style.color = '#f4f4fc';
                balao.style.borderBottomLeftRadius = '4px';
            } else {
                balao.className = 'message-system';
            }
            
            balao.innerText = texto;
            chatContainer.appendChild(balao);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return balao;
        }

        async function chamarGroq(mensagemUsuario, balaoIA) {
            // Ajusta o comportamento da IA com base no botão selecionado
            let comandoSistema = "Você é o NexusAI, um assistente prestativo e inteligente criado por @GUIWZ.045.";
            if (modoAtual === "direta") {
                comandoSistema += " Seja extremamente direto, curto e objetivo nas respostas. Evite enrolação.";
            } else if (modoAtual === "detalhada") {
                comandoSistema += " Explique a resposta detalhadamente, organizando em formato de passo a passo ou tópicos.";
            }

            try {
                const response = await fetch("https://groq.com", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [
                            { role: "system", content: comandoSistema },
                            { role: "user", content: mensagemUsuario }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    balaoIA.innerText = data.choices[0].message.content;
                } else {
                    balaoIA.innerText = "Erro: Não recebi uma resposta válida da Groq.";
                }
            } catch (error) {
                console.error(error);
                balaoIA.innerText = "Erro técnico ao conectar com a IA da Groq. Verifique sua chave de API.";
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function enviarMensagem() {
            const text = searchInput.value.trim();
            if(text !== "") {
                adicionarBalao(text, 'usuario');
                searchInput.value = "";
                
                // Cria o balão de "Pensando..." da IA antes de disparar a requisição
                const balaoIA = adicionarBalao("NexusAI está pensando...", 'ia');
                chamarGroq(text, balaoIA);
            }
        }

        document.getElementById('btn-clear').addEventListener('click', () => {
            chatContainer.innerHTML = '<div class="message-system">[CHAT LIMPO - SISTEMA ONLINE]</div>';
        });

        sendBtn.addEventListener('click', enviarMensagem);
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensagem();
            }
        });
            </script>
