<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusAI Pro (Livre)</title>
  <style>
    body { background-color: #0b0914; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 12px; border-radius: 12px; word-break: break-word; }
    .user { background: #6366f1; align-self: flex-end; }
    .bot { background: #1e1b4b; align-self: flex-start; border: 1px solid #312e81; }
    #input-area { display: flex; padding: 12px; background: #13111c; border-top: 1px solid #231f3d; }
    input { flex: 1; background: #1e1b4b; border: 1px solid #312e81; padding: 12px; border-radius: 8px; color: #fff; outline: none; }
    button { background: #6366f1; border: none; padding: 0 16px; margin-left: 8px; border-radius: 8px; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="chat">
    <div class="message bot">Olá! Pronto para conversar sem censura.</div>
  </div>
  <div id="input-area">
    <input type="text" id="userInput" placeholder="Digite sua mensagem...">
    <button onclick="sendMessage()">➤</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chat = document.getElementById('chat');
      const text = input.value.trim();
      if (!text) return;

      chat.innerHTML += `<div class="message user">${text}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: [{ role: 'user', content: text }] })
        });
        
        const data = await response.json();
        const reply = data.reply || data.error || "Erro desconhecido no servidor.";
        chat.innerHTML += `<div class="message bot">${reply}</div>`;
      } catch (err) {
        chat.innerHTML += `<div class="message bot">Falha na requisição: ${err.message}</div>`;
      }
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('userInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
