<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #050507; color: #f4f4fc; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* TELA DE CARREGAMENTO */
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d0d11; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.4s ease; }
        .splash-logo { color: #d8b4fe; font-size: 28px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        
        /* ESTRUTURA HÍBRIDA (PC / CELULAR) */
        .site-wrapper { width: 100%; height: 100vh; max-width: 700px; display: flex; flex-direction: column; background-color: #0d0d11; }
        @media (min-width: 768px) { .site-wrapper { height: 85vh; border-radius: 12px; border: 1px solid rgba(168, 85, 247, 0.2); } }
        
        .site-header { padding: 12px; border-bottom: 1px solid rgba(168, 85, 247, 0.15); text-align: center; background: linear-gradient(180deg, rgba(168, 85, 247, 0.05), transparent); }
        .site-header h1 { font-size: 20px; color: #d8b4fe; }
        .site-header span { color: #a78bfa; font-size: 11px; }

        .preset-bar { display: flex; padding: 8px; gap: 6px; border-bottom: 1px solid rgba(168, 85, 247, 0.1); }
        .tag-btn { flex: 1; background: rgba(168, 85, 247, 0.05); border: 1px solid rgba(168, 85, 247, 0.2); color: #a78bfa; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .tag-btn.tag-active { background: rgba(168, 85, 247, 0.25); color: #fff; border-color: #a855f7; }

        #chat-container { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-system { max-width: 90%; margin: 4px auto; padding: 6px 12px; background: rgba(168, 85, 247, 0.05); border: 1px solid rgba(168, 85, 247, 0.15); border-radius: 20px; font-size: 11px; color: #a78bfa; text-align: center; }

        .input-area { padding: 12px; border-top: 1px solid rgba(168, 85, 247, 0.15); display: flex; flex-direction: column; gap: 8px; }
        .input-row { display: flex; gap: 6px; }
        .textarea-input { flex: 1; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(168, 85, 247, 0.25); border-radius: 10px; padding: 10px; color: #f4f4fc; font-size: 14px; resize: none; height: 42px; outline: none; }
        .btn-action { background: linear-gradient(135deg, #a855f7, #6366f1); border: none; width: 42px; height: 42px; border-radius: 10px; color: #fff; cursor: pointer; font-size: 15px; }
        .btn-secondary-row { display: flex; gap: 6px; }
        .btn-small { flex: 1; background: rgba(168, 85, 247, 0.1); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.2); padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo">NexusAI</div>
        <div style="color: #a78bfa; font-size: 13px;">BY @GUIWZ.045</div>
    </div>

    <div class="site-wrapper">
        <header class="site-header">
            <h1>NexusAI</h1>
            <span>@GUIWZ.045</span>
        </header>

        <div class="preset-bar">
            <button class="tag-btn tag-active" data-mode="padrao">✨ Padrão</button>
            <button class="tag-btn" data-mode="direta">🎯 Direta</button>
            <button class="tag-btn" data-mode="detalhada">📚 Passo a Passo</button>
        </div>

        <main id="chat-container">
            <div class="message-system">[SISTEMA ONLINE - ENVIE UMA MENSAGEM OU PRINT]</div>
        </main>

        <footer class="input-area">
            <div class="input-row">
                <textarea id="input-search" class="textarea-input" placeholder="Pergunte qualquer coisa..."></textarea>
                <button id="btn-search" class="btn-action">⚡</button>
            </div>
            <div class="btn-secondary-row">
                <button id="btn-upload" class="btn-small">📸 ANEXAR PRINT</button>
                <button id="btn-clear" class="btn-small" style="color: #f87171; border-color: rgba(248, 113, 113, 0.15);">🗑️ LIMPAR CHAT</button>
            </div>
        </footer>
    </div>

    <script>
        // 1. Esconder Splash Screen
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 400);
            }
        });

        // 2. Comportamento dos Botões de Modo
        let modoAtual = "padrao";
        const buttons = document.querySelectorAll('.tag-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('tag-active'));
                btn.classList.add('tag-active');
                modoAtual = btn.getAttribute('data-mode');
            });
        });

        // 3. Conexão do Chat com a Groq
        const searchInput = document.getElementById('input-search');
        const sendBtn = document.getElementById('btn-search');
        const chatContainer = document.getElementById('chat-container');
        
        const GROQ_KEY = "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"; 

        function criarBalao(texto, tipo) {
            const balao = document.createElement('div');
            balao.style.maxWidth = '80%';
            balao.style.padding = '10px 14px';
            balao.style.borderRadius = '12px';
            balao.style.fontSize = '14px';
            balao.style.lineHeight = '1.4';
            balao.style.wordBreak = 'break-word';
            balao.style.marginBottom = '6px';
            
            if (tipo === 'user') {
                balao.style.alignSelf = 'flex-end';
                balao.style.background = 'linear-gradient(135deg, #a855f7, #6366f1)';
                balao.style.color = '#fff';
            } else {
                balao.style.alignSelf = 'flex-start';
                balao.style.background = 'rgba(255, 255, 255, 0.05)';
                balao.style.border = '1px solid rgba(168, 85, 247, 0.2)';
                balao.style.color = '#f4f4fc';
            }
            
            balao.innerText = texto;
            chatContainer.appendChild(balao);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return balao;
        }

        async function chamarGroq(mensagem, balaoIA) {
            let sistema = "Você é o NexusAI, criado por @GUIWZ.045.";
            if (modoAtual === "direta") sistema += " Responda de forma extremamente curta, direta e objetiva.";
            if (modoAtual === "detalhada") sistema += " Explique de forma aprofundada, dividida em tópicos ou passo a passo.";

            try {
                const response = await fetch("https://groq.com", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [
                            { role: "system", content: sistema },
                            { role: "user", content: mensagem }
                        ]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    balaoIA.innerText = data.choices[0].message.content;
                } else {
                    balaoIA.innerText = "Erro: API não retornou texto.";
                }
            } catch (err) {
                balaoIA.innerText = "Erro ao conectar com a Groq. Verifique a internet.";
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function dispararMensagem() {
            const text = searchInput.value.trim();
            if (text !== "") {
                criarBalao(text, 'user');
                searchInput.value = "";
                const balaoIA = criarBalao("NexusAI está digitando...", 'ia');
                chamarGroq(text, balaoIA);
            }
        }

        // Eventos
        sendBtn.addEventListener('click', dispararMensagem);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                dispararMensagem();
            }
        });
        document.getElementById('btn-clear').addEventListener('click', () => {
            chatContainer.innerHTML = '<div class="message-system">[CHAT LIMPO]</div>';
        });
        document.getElementById('btn-upload').addEventListener('click', () => {
            alert("Função de upload de imagens será integrada no servidor em breve.");
        });
    </script>
</body>
</html>
