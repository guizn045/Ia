<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusAI - 100% Local & Livre</title>
  <style>
    body { background-color: #0b0914; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #13111c; padding: 12px; text-align: center; border-bottom: 1px solid #231f3d; font-weight: bold; font-size: 14px; color: #a5b4fc; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 85%; padding: 12px; border-radius: 12px; word-break: break-word; line-height: 1.4; font-size: 15px; }
    .user { background: #6366f1; align-self: flex-end; }
    .bot { background: #1e1b4b; align-self: flex-start; border: 1px solid #312e81; }
    #input-area { display: flex; padding: 12px; background: #13111c; border-top: 1px solid #231f3d; }
    input { flex: 1; background: #1e1b4b; border: 1px solid #312e81; padding: 12px; border-radius: 8px; color: #fff; outline: none; font-size: 15px; }
    button { background: #6366f1; border: none; padding: 0 18px; margin-left: 8px; border-radius: 8px; color: #fff; cursor: pointer; font-weight: bold; }
    button:disabled { background: #312e81; color: #818cf8; cursor: not-allowed; }
  </style>
</head>
<body>
  <header id="status">A preparar motor local (aguarde...)</header>
  
  <div id="chat">
    <div class="message bot">Olá! Este chat roda 100% no teu telemóvel, sem servidores externos e sem censura. A descarregar o motor de IA na primeira execução...</div>
  </div>

  <div id="input-area">
    <input type="text" id="userInput" placeholder="A carregar IA..." disabled>
    <button id="sendBtn" onclick="sendMessage()" disabled>➤</button>
  </div>

  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;
    const statusHeader = document.getElementById("status");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const chat = document.getElementById("chat");

    const initProgressCallback = (report) => {
      statusHeader.innerText = report.text;
    };

    async function loadAI() {
      try {
        // Usando um ID de modelo padrão e 100% compatível
        const selectedModel = "Llama-3-8B-Instruct-q4f32_1";
        
        engine = await webllm.CreateMLCEngine(
          selectedModel,
          { initProgressCallback: initProgressCallback }
        );

        statusHeader.innerText = "NexusAI Local Ativo (Sem Censura)";
        statusHeader.style.color = "#4ade80";
        userInput.placeholder = "Digite sua mensagem sem filtros...";
        userInput.disabled = false;
        sendBtn.disabled = false;
        
        chat.innerHTML += `<div class="message bot">Motor carregado com sucesso! Podes começar a conversar.</div>`;
      } catch (err) {
        statusHeader.innerText = "Erro ao iniciar motor local";
        chat.innerHTML += `<div class="message bot">Erro: O teu navegador ou telemóvel pode não suportar WebGPU. Certifica-te de usar o Google Chrome atualizado no telemóvel. (${err.message})</div>`;
      }
    }

    loadAI();

    window.sendMessage = async function() {
      const text = userInput.value.trim();
      if (!text || !engine) return;

      chat.innerHTML += `<div class="message user">${text}</div>`;
      userInput.value = '';
      chat.scrollTop = chat.scrollHeight;

      const botMsgDiv = document.createElement("div");
      botMsgDiv.className = "message bot";
      botMsgDiv.innerText = "...";
      chat.appendChild(botMsgDiv);
      chat.scrollTop = chat.scrollHeight;

      try {
        const messages = [{ role: "user", content: text }];
        const chunks = await engine.chat.completions.create({
          messages: messages,
          stream: true,
        });

        let reply = "";
        for await (const chunk of chunks) {
          const content = chunk.choices[0]?.delta?.content || "";
          reply += content;
          botMsgDiv.innerText = reply;
          chat.scrollTop = chat.scrollHeight;
        }
      } catch (err) {
        botMsgDiv.innerText = "Erro na geração: " + err.message;
      }
    };

    document.getElementById('userInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
    });
  </script>
</body>
</html>
