<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: #09090b; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* Animação de entrada (Splash Screen) */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #09090b; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.6s ease, visibility 0.6s ease; }
        .splash-content { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: pulseGlow 2s infinite ease-in-out; }
        .splash-logo { width: 70px; height: 70px; background: linear-gradient(135deg, #a855f7, #6366f1); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 0 30px rgba(168,85,247,0.5); }
        .splash-title { color: #f4f4f5; font-size: 24px; font-weight: 800; letter-spacing: 2px; }
        .splash-sub { color: #a855f7; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        
        .wrapper { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #09090b; position: relative; }
        
        header { padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; background: #0d0d12; }
        .header-title h2 { color: #e9d5ff; font-size: 16px; font-weight: 700; }
        .header-title span { color: #a855f7; font-size: 11px; font-weight: 600; }

        .dev-warning { background: linear-gradient(90deg, rgba(168,85,247,0.15), rgba(99,102,241,0.15)); border-bottom: 1px solid rgba(168,85,247,0.2); color: #d8b4fe; font-size: 11px; text-align: center; padding: 6px; font-weight: 600; letter-spacing: 0.5px; }
        
        .bar { display: flex; padding: 8px 12px; gap: 8px; background: #0d0d12; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .btn { flex: 1; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); color: #a1a1aa; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn.active { background: rgba(168, 85, 247, 0.2); color: #f3e8ff; border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.2); }
        
        #chat { flex: 1; padding: 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; width: 100%; max-width: 900px; margin: 0 auto; }
        .sys { font-size: 11px; color: #71717a; text-align: center; margin: 4px; font-weight: 500; }

        .message-row { display: flex; width: 100%; margin-bottom: 4px; }
        .message-row.user { justify-content: flex-end; }
        .message-row.ai { justify-content: flex-start; }

        .bubble { max-width: 90%; padding: 12px 16px; border-radius: 14px; font-size: 14.5px; line-height: 1.6; word-break: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .message-row.user .bubble { background: linear-gradient(135deg, #9333ea, #4f46e5); color: #fff; border-bottom-right-radius: 4px; }
        
        /* Detalhes extras no balão da IA */
        .message-row.ai .bubble { background: #18181b; border: 1px solid rgba(168, 85, 247, 0.2); color: #f4f4f5; border-bottom-left-radius: 4px; font-weight: 400; }
        .ai-header { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #c084fc; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        footer { padding: 12px 16px; background: #0d0d12; border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; gap: 8px; }
        
        .row { display: flex; gap: 8px; align-items: center; max-width: 900px; width: 100%; margin: 0 auto; }
        textarea { flex: 1; background: #18181b; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px; color: #fff; resize: none; height: 48px; outline: none; font-size: 14px; }
        textarea:focus { border-color: #a855f7; box-shadow: 0 0 0 2px rgba(168,85,247,0.2); }
        
        #send { background: linear-gradient(135deg, #a855f7, #6366f1); border: none; width: 48px; height: 48px; border-radius: 12px; color: #fff; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
        #send:active { transform: scale(0.95); }
        
        .sub-btn { background: none; color: #71717a; border: none; padding: 4px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; }
        .sub-btn:hover { color: #a1a1aa; }
    </style>
</head>
<body>
    <!-- Splash Screen Animada -->
    <div id="splash">
        <div class="splash-content">
            <div class="splash-logo">✨</div>
            <div class="splash-title">NexusAI</div>
            <div class="splash-sub">@GUIWY_045</div>
        </div>
    </div>
    
    <div class="wrapper">
        <header>
            <div class="header-title">
                <h2>NexusAI</h2>
                <span>@GUIWY_045</span>
            </div>
        </header>

        <div class="dev-warning">⚠️ Essa IA está em desenvolvimento</div>

        <div class="bar">
            <button class="btn active" data-m="Padrão">✨ Padrão</button>
            <button class="btn" data-m="Direto">🎯 Direto</button>
            <button class="btn" data-m="Passo a Passo">📚 Passo a Passo</button>
        </div>

        <main id="chat"></main>

        <footer>
            <div class="row">
                <textarea id="txt" placeholder="Pergunte qualquer coisa..."></textarea>
                <button id="send">➔</button>
            </div>
            <div class="row" style="justify-content: center;">
                <button id="clear" class="sub-btn">🗑️ Limpar conversa atual</button>
            </div>
        </footer>
    </div>

    <script>
        // Fecha o splash screen com animação suave
        window.addEventListener('load', () => {
            setTimeout(() => {
                const sp = document.getElementById('splash');
                if (sp) { sp.style.opacity = '0'; setTimeout(() => sp.style.display = 'none', 600); }
            }, 800);
        });
        
        let modo = "Padrão";
        
        // Histórico independente para cada aba/opção
        const historico = {
            "Padrão": [],
            "Direto": [],
            "Passo a Passo": []
        };

        const chat = document.getElementById('chat');

        function renderizarChat() {
            chat.innerHTML = "";
            const msgs = historico[modo];
            
            if (msgs.length === 0) {
                chat.innerHTML = `<div class="sys">[SISTEMA PRONTO - MODO ${modo.toUpperCase()}]</div>`;
                return;
            }

            msgs.forEach(m => {
                const row = document.createElement('div');
                row.className = 'message-row ' + (m.usuario ? 'user' : 'ai');

                const b = document.createElement('div');
                b.className = 'bubble';

                if (!m.usuario) {
                    const header = document.createElement('div');
                    header.className = 'ai-header';
                    header.innerHTML = '✨ NexusAI';
                    b.appendChild(header);
                }

                const content = document.createElement('div');
                content.innerText = m.texto;
                b.appendChild(content);

                row.appendChild(b);
                chat.appendChild(row);
            });
        }

        const btns = document.querySelectorAll('.btn');
        btns.forEach(b => b.addEventListener('click', () => {
            btns.forEach(x => x.classList.remove('active')); 
            b.classList.add('active');
            modo = b.getAttribute('data-m');
            renderizarChat(); // Troca instantaneamente para o histórico da aba selecionada
        }));

        const txt = document.getElementById('txt'), send = document.getElementById('send');

        function limparMarkdown(texto) {
            return texto
                .replace(/###\s*/g, '')
                .replace(/##\s*/g, '')
                .replace(/#\s*/g, '')
                .replace(/\*\*/g, '')
                .replace(/\*/g, '')
                .replace(/[-|]/g, ' ')
                .replace(/\{2,\}/g, ' ')
                .trim();
        }

        async function enviar() {
            const val = txt.value.trim(); 
            if (!val) return;

            // Adiciona a mensagem do usuário no histórico do modo atual
            historico[modo].push({ texto: val, usuario: true });
            renderizarChat();
            txt.value = "";

            // Adiciona placeholder de pensamento da IA
            historico[modo].push({ texto: "Pensando...", usuario: false });
            renderizarChat();

            const rowsAi = chat.querySelectorAll('.message-row.ai');
            const lastAiRow = rowsAi[rowsAi.length - 1];

            try {
                let systemPrompt = "Você é o NexusAI, um assistente inteligente criado por @GUIWY_045. Responda de forma limpa, direta, sem usar marcações de código markdown complexas.";
                if (modo === "Direto") systemPrompt += " Seja extremamente direto, curto e objetivo.";
                if (modo === "Passo a Passo") systemPrompt += " Explique de forma organizada em tópicos limpos.";

                const p1 = "gsk_YoGlAqyP";
                const p2 = "fjgdOinVn7NEWG";
                const p3 = "dyb3FYjSHSCaVyfJX2d9aQ3n3UK0VV";
                const apiKey = p1 + p2 + p3;

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: val }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                let respostaFinal = "";

                if (data.choices && data.choices.length > 0) {
                    respostaFinal = limparMarkdown(data.choices[0].message.content);
                } else if (data.error) {
                    respostaFinal = "Erro: " + (data.error.message || "Tente novamente.");
                } else {
                    respostaFinal = "Erro ao processar resposta.";
                }

                // Atualiza o histórico com a resposta real
                historico[modo][historico[modo].length - 1].texto = respostaFinal;
                renderizarChat();

                // Mantém o início da resposta visível no topo (estilo IA normal)
                const updatedAiRows = chat.querySelectorAll('.message-row.ai');
                const currentAiRow = updatedAiRows[updatedAiRows.length - 1];
                if (currentAiRow) {
                    currentAiRow.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }

            } catch (error) {
                historico[modo][historico[modo].length - 1].texto = "Falha de conexão com a API.";
                renderizarChat();
                console.error(error);
            }
        }

        send.addEventListener('click', enviar);
        txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });
        
        document.getElementById('clear').addEventListener('click', () => { 
            historico[modo] = [];
            renderizarChat(); 
        });

        // Inicializa o chat vazio no carregamento
        renderizarChat();
    </script>
</body>
</html>
